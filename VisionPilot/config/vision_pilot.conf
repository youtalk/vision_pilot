# VisionPilot configuration template
#   cp config/vision_pilot.conf.example config/vision_pilot.conf

# ─── Input source ────────────────────────────────────────────────────────────
source.mode             = video

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

# ─── ONNX models ───────────────────────────────────────────────────────────────
engine.provider     = cuda
engine.device_id    = 0
engine.cache_dir    = /tmp/visionpilot_trt_cache
engine.workspace_gb = 1.0

# Model precision fp32 or int8 for quantized models lowercase
model.precision    = fp32

# ─── Merged single-session inference ─────────────────────────────────────────
# Run all three networks in one session over a merged graph. Required when
# engine.provider = renesas, which permits one NPU session per process.
# Default false: three separate sessions, unchanged behaviour.
model.merged      = false
model.merged_path =
# auto | none | <path to contract.json>
# "auto" looks for <merged_path>.contract.json, or contract.json inside
# engine.artifacts_dir under the renesas provider. A rewritten (v6/v7) model
# without its contract is refused rather than misread.
model.contract    = auto

# ─── Renesas R-Car X5H NPU ───────────────────────────────────────────────────
# Compiled artifact set: must contain nnx/, fused_subgraphs/, legalized_*.onnx.
# Ship candidate: .../merged/v7_frozen_s3cal_artifacts
engine.artifacts_dir     =
# Directory holding the vendor runtime's arc_prog binaries.
engine.arc_prog_path     =
# Minimum node count required on the NPU at startup. 0 means at least one.
engine.require_npu_nodes = 0

# ───────────────────────────────────────────────────────────────────────────────
speed_limit      = 33.3;   # m/s
L                = 2.860   # Front axle to CoG (m). Wheelbase L = Lf + Lr

# ─── GUI ───────────────────────────────────────────────────────────────────────
# Enable/Disable visualization
visualization_on = true

# Enable/Disable webrtc
webrtc_on = false
webrtc_port = 8080

# ─── Rerun logging ───────────────────────────────────────────────────────────
# Stream per-frame data directly to an .rrd recording (open with: rerun <file>).
rrd_on  = false
rrd_log = visionpilot.rrd