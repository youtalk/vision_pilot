# VisionPilot configuration template
#   cp config/vision_pilot.conf.example config/vision_pilot.conf

# ─── Input source ────────────────────────────────────────────────────────────
source.mode             = video

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

# ─── ONNX models ───────────────────────────────────────────────────────────────
engine.provider     = cuda
engine.device_id    = 0
engine.cache_dir    = /tmp/visionpilot_trt_cache
engine.workspace_gb = 1.0

# Model precision fp32 or int8 for quantized models lowercase
model.precision    = fp32

# ───────────────────────────────────────────────────────────────────────────────
speed_limit      = 33.3;   # m/s
L                = 2.860   # Front axle to CoG (m). Wheelbase L = Lf + Lr

# ─── GUI ───────────────────────────────────────────────────────────────────────
# Enable/Disable visualization
visualization_on = true

# Enable/Disable webrtc
webrtc_on = false
webrtc_port = 8080

# Dashboard stack endpoint: ws://<host>:<dashboard_port>/ with JSON messages
dashboard_on = false
dashboard_port = 8090
dashboard_device =
# Meters from the rear axle forward to the H.yaml origin, because the dashboard's ego frame starts
# at the rear axle. On vehicle.lincoln.mkz: 1.4 for the CARLA rig's H_carla.yaml (origin at the
# actor origin), 3.8 for the front bumper origin of Calibration/README.md.
dashboard_rear_axle_m = 0.0

# ─── Rerun logging ───────────────────────────────────────────────────────────
# Stream per-frame data directly to an .rrd recording (open with: rerun <file>).
rrd_on  = false
rrd_log = visionpilot.rrd