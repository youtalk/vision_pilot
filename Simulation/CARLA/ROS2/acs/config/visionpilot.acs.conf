# VisionPilot configuration - CARLA closed-loop drive under autoware_carla_scenario.
#
# ../../config/visionpilot.carla.conf at the scenarios' speed: the cut-in runs at
# 30 km/h, so speed_limit is 8.33 m/s rather than 4.0.
#
# Bind-mounted read-only over VisionPilot/config/vision_pilot.conf at run time,
# so the in-tree template stays pristine. Requires a build with
# -DENABLE_ROS2_INTERFACE=ON (docker/build.sh --gpu --ros2).

# --- Input source ------------------------------------------------------------
# The camera arrives over ROS 2, from autoware_carla_scenario (or from CARLA
# itself under -ros2); the topic is set in vision_pilot_ros2.conf.
source.mode             = ros2

# --- ONNX models -------------------------------------------------------------
engine.provider     = cuda
engine.device_id    = 0
engine.cache_dir    = /cache
engine.workspace_gb = 1.0

model.precision    = fp32

# --- Vehicle -----------------------------------------------------------------
# speed_limit caps the longitudinal planner. CARLA's lincoln.mkz has a 2.85 m
# wheelbase, which is what the spatial MPC's bicycle model wants for L.
speed_limit      = 8.33
L                = 2.860

# --- GUI ---------------------------------------------------------------------
visualization_on = false
webrtc_on = false
webrtc_port = 8080

# --- Rerun logging -----------------------------------------------------------
rrd_on  = false
rrd_log = visionpilot.rrd

# Diagnostics: prints the lane path fit (point count / failure) each cycle.
fusion.debug = true
